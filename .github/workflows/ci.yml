name: CI

# Gate every push to main (and every PR) on typechecking and a full production
# build so a commit that breaks svelte-check or the adapter-static build is
# caught before it can land on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Production build
        run: npm run build
